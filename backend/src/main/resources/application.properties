spring.application.name=backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/linkvault
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework

# Flyway baselines are explicit for existing databases; never auto-baseline an
# unknown non-empty schema. Empty databases use the B8 cumulative baseline.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=8
spring.flyway.baseline-on-migrate=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Per-process login request guard. Hosted multi-instance deployments should
# enforce an equivalent shared limit at the trusted gateway or shared store.
app.auth.login-rate-limit.max-attempts=10
app.auth.login-rate-limit.window-ms=900000
app.auth.login-rate-limit.max-tracked-clients=10000

server.servlet.session.persistent=false
