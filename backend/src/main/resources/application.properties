spring.application.name=backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/linkvault
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway baselines are explicit for existing databases; never auto-baseline an
# unknown non-empty schema. Empty databases use the B8 cumulative baseline.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=8
spring.flyway.baseline-on-migrate=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
